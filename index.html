<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a1a2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Radar BOE IA">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icono.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
</head><body>
<title>Radar BOE IA</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* Layout: menú lateral azul noche; la portada dice primero cuántas normas se han revisado, cuántas valen y cuántas no, y por qué. */
:root{
  --bg:#edf1f6; --surface:#ffffff; --surface-2:#f4f7fb; --ink:#0d1a2b; --muted:#566377; --line:#dbe2ec;
  --night:#0a1a2e; --night-2:#10263f; --night-ink:#d6e2f0; --night-mute:#7f95b0; --scope:#47d1c4;
  --accent:#1b63b5; --accent-ink:#ffffff; --accent-soft:#e2edfa;
  --alta:#c2332d; --alta-bg:#fde8e6; --media:#9a6200; --media-bg:#fdf0d5; --ok:#1d7a4c; --ok-bg:#ddf3e7; --info:#566377; --info-bg:#e9edf3;
  --area-l:42%; --area-bg-l:94%; --area-s:62%;
  --f-display:"Bricolage Grotesque","IBM Plex Sans",system-ui,sans-serif;
  --f-ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --shadow:0 1px 2px rgba(13,26,43,.06),0 8px 24px -12px rgba(13,26,43,.18);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b121c; --surface:#131d2a; --surface-2:#182434; --ink:#e6edf5; --muted:#98a6b9; --line:#253345;
  --night:#07111d; --night-2:#0d1d30; --night-ink:#d6e2f0; --night-mute:#7086a1; --scope:#47d1c4;
  --accent:#78b3f2; --accent-ink:#06121f; --accent-soft:#16283d;
  --alta:#ff8a7f; --alta-bg:#3a1c1a; --media:#f1c35c; --media-bg:#33280e; --ok:#6fd4a1; --ok-bg:#132f20; --info:#a8b5c6; --info-bg:#212d3c;
  --area-l:70%; --area-bg-l:18%; --area-s:55%; --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b121c; --surface:#131d2a; --surface-2:#182434; --ink:#e6edf5; --muted:#98a6b9; --line:#253345;
  --night:#07111d; --night-2:#0d1d30; --night-ink:#d6e2f0; --night-mute:#7086a1; --scope:#47d1c4;
  --accent:#78b3f2; --accent-ink:#06121f; --accent-soft:#16283d;
  --alta:#ff8a7f; --alta-bg:#3a1c1a; --media:#f1c35c; --media-bg:#33280e; --ok:#6fd4a1; --ok-bg:#132f20; --info:#a8b5c6; --info-bg:#212d3c;
  --area-l:70%; --area-bg-l:18%; --area-s:55%; --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6);
  color-scheme:dark}
html,body{height:100%}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-ui)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100%}

/* Menú */
.side{background:var(--night);color:var(--night-ink);display:flex;flex-direction:column;gap:22px;padding:22px 14px;position:sticky;top:0;height:100vh;max-height:100%}
.brand{display:flex;gap:11px;align-items:center;padding:0 6px}
.avatar{width:42px;height:42px;flex:none;border-radius:12px;box-shadow:0 0 0 1px rgba(255,255,255,.12)}
.brand b{display:block;font:800 18px/1.1 var(--f-display);color:#fff;letter-spacing:-.01em}
.brand small{color:var(--night-mute);font-size:12px}
.nav{display:flex;flex-direction:column;gap:3px}
.nav-label{font:600 11px/1 var(--f-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--night-mute);padding:14px 10px 6px}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:10px;color:var(--night-ink);text-decoration:none;font-weight:500;transition:background .15s}
.nav a:hover{background:rgba(255,255,255,.06)}
.nav a.on{background:linear-gradient(90deg,rgba(71,209,196,.18),rgba(71,209,196,.04));color:#fff;box-shadow:inset 2px 0 0 var(--scope)}
.nav svg{width:19px;height:19px;flex:none}
.nav .count{margin-left:auto;font:600 12px/1 var(--f-mono);background:var(--scope);color:var(--night);padding:3px 7px;border-radius:99px}
.side-foot{margin-top:auto;font-size:12px;color:var(--night-mute);padding:0 10px;line-height:1.5}

.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding-block:14px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);position:sticky;top:env(safe-area-inset-top,0px);z-index:5;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.crumbs{color:var(--muted);font-size:13px}.crumbs b{color:var(--ink)}
.grow{flex:1}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:7px 14px;width:min(320px,100%)}
.search input{border:0;background:none;outline:none;width:100%;min-width:0}
.search svg{width:16px;height:16px;color:var(--muted);flex:none}
.day select{background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:7px 12px}
.view{padding-block:26px 56px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:26px;max-width:1220px;width:100%}
h1{font:800 34px/1.1 var(--f-display);letter-spacing:-.02em;margin:0;text-wrap:balance}
h2{font:700 21px/1.25 var(--f-display);letter-spacing:-.01em;margin:0;text-wrap:balance}
h3{font:600 12px/1.2 var(--f-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0}
.sub{color:var(--muted);margin:6px 0 0;max-width:68ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.pad{padding:20px 22px}
.sec-head{display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 14px;cursor:pointer;font-weight:500;text-decoration:none;color:var(--ink);font-size:14px;transition:border-color .15s,transform .15s}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{display:inline-flex;align-items:center;gap:7px;font:600 11.5px/1 var(--f-ui);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.pill.p-pend::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent)}
.p-alta{color:var(--alta)}.p-media{color:var(--media)}
.p-pend{color:var(--ink)}.p-leida{color:var(--muted)}.p-env{color:var(--ok)}
.area{--c:hsl(var(--h) var(--area-s) var(--area-l));--cb:hsl(var(--h) 60% var(--area-bg-l));display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:5px 10px 5px 7px;border-radius:99px;background:var(--cb);color:var(--c);white-space:nowrap}
.adot{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}
.areas-t{display:inline-flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:13px;font-weight:500;color:var(--muted)}.areas-t .sep{color:var(--line)}
.mono{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.meter{display:inline-flex;gap:3px;align-items:center}
.meter i{width:16px;height:6px;border-radius:3px;background:var(--line)}
.meter.r3 i{background:var(--alta)}.meter.r2 i:nth-child(-n+2){background:var(--media)}


/* Embudo */
.funnel{display:grid;gap:12px}
.fbar{display:grid;grid-template-columns:150px minmax(0,1fr) 60px;gap:14px;align-items:center}
.fbar .lab{font-size:14px;color:var(--muted)}
.fbar .track{height:14px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.fbar .fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--scope));transform-origin:left;animation:grow .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleX(0)}}
.fbar b{font:700 22px/1 var(--f-display);text-align:right;font-variant-numeric:tabular-nums}
.duo{display:grid;grid-template-columns:minmax(0,1fr);gap:20px}
.ev{font-size:12.5px}

/* Semana */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.wd{border:1px solid var(--line);border-radius:12px;padding:10px 8px;min-height:104px;display:flex;flex-direction:column;gap:6px;background:var(--surface-2)}
.wd.hoy{border-color:var(--accent);background:var(--accent-soft)}
.wd .n{font:700 20px/1 var(--f-display)}.wd .w{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.ev{font-size:11.5px;line-height:1.3;padding:5px 6px;border-radius:7px;background:var(--surface);border-left:3px solid var(--accent);text-decoration:none;color:var(--ink);display:block}

/* Tarjetas de fichas */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.fc{display:flex;flex-direction:column;gap:12px;padding:18px 20px;text-decoration:none;color:inherit;position:relative;overflow:hidden;transition:transform .18s,box-shadow .18s}
.fc:hover{border-color:var(--accent)}
.fc .top-row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.fc h2{font-size:19px}
.fc p{margin:0;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.fc .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:99px;cursor:pointer;color:var(--muted);font-weight:500}
.tab.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.tab .n{font:600 11px/1 var(--f-mono);margin-left:6px;opacity:.8}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters select{background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:7px 12px}
.empty{padding:36px 20px;color:var(--muted);text-align:center}

/* Ficha */
.fhero{border-radius:16px;padding:26px 30px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);}
.fhero h1{font-size:32px;margin:12px 0 10px;max-width:30ch}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
.ptabs{display:flex;gap:4px;border-bottom:1px solid var(--line);padding:0 14px;overflow-x:auto}
.ptab{border:0;background:none;padding:14px 12px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.ptab.on{color:var(--ink);border-bottom-color:var(--accent)}
.pane{padding:22px;display:flex;flex-direction:column;gap:18px}
.field h3{margin-bottom:6px}.field p{margin:0;max-width:70ch}
.explain{display:grid;grid-template-columns:44px minmax(0,1fr);gap:14px;background:var(--accent-soft);border-radius:14px;padding:18px;font-size:16.5px;line-height:1.65}
.explain .q{width:44px;height:44px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:800 22px/1 var(--f-display)}
.aside{display:flex;flex-direction:column;gap:16px}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tl li{display:grid;grid-template-columns:16px minmax(0,1fr);gap:10px;padding-bottom:14px;position:relative}
.tl li::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--accent);margin-top:6px;box-shadow:0 0 0 4px var(--accent-soft)}
.tl li:not(:last-child)::after{content:"";position:absolute;left:4.5px;top:18px;bottom:0;width:1px;background:var(--line)}
.tl b{display:block}.tl span{font-size:13px;color:var(--muted)}
.actions{display:flex;flex-direction:column;gap:8px}
.actions .btn{justify-content:center}
textarea{width:100%;min-height:120px;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface-2);resize:vertical}
.saved,.note{font-size:13px;color:var(--muted)}
.chat{display:flex;flex-direction:column;gap:10px}
.msg{padding:12px 15px;border-radius:16px;max-width:72ch;white-space:pre-wrap}
.msg.yo{background:var(--accent);color:var(--accent-ink);align-self:flex-end;border-bottom-right-radius:4px}
.msg.ia{background:var(--surface-2);border:1px solid var(--line);border-bottom-left-radius:4px}
.ask{display:flex;gap:8px}
.ask input{flex:1;min-width:0;border:1px solid var(--line);border-radius:99px;padding:9px 14px;background:var(--surface-2)}
.sugg{display:flex;gap:6px;flex-wrap:wrap}
.sugg button{border:1px dashed var(--line);background:none;border-radius:99px;padding:6px 12px;cursor:pointer;font-size:13px;color:var(--muted)}
.sugg button:hover{border-color:var(--accent);color:var(--accent)}
.toast{position:fixed;bottom:calc(22px + env(safe-area-inset-bottom,0px));right:calc(22px + env(safe-area-inset-right,0px));background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-size:14px;z-index:20;box-shadow:var(--shadow)}

/* Áreas, glosario, cómo funciona */
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.ac{--c:hsl(var(--h) var(--area-s) var(--area-l));padding:18px;display:flex;flex-direction:column;gap:8px;text-decoration:none;color:inherit;transition:transform .18s}
.ac:hover{transform:translateY(-3px)}
.ac .ic{width:42px;height:42px;border-radius:12px;background:hsl(var(--h) 60% var(--area-bg-l));color:var(--c);display:grid;place-items:center}
.ac .ic svg{width:22px;height:22px}
.ac .num{font:800 30px/1 var(--f-display)}.ac .num.zero{color:var(--muted);opacity:.6}
.gl{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.gc{padding:18px}.gc b{font:700 18px/1.2 var(--f-display);display:block;margin-bottom:6px}.gc p{margin:0;color:var(--muted)}
.flow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.st{padding:20px;display:flex;flex-direction:column;gap:8px}
.st .k{font:800 40px/1 var(--f-display);color:var(--accent)}
.st b{font-size:16px}

/* Portada: lo revisado, lo que vale y lo que no */
.triage{padding:26px 28px;display:flex;flex-direction:column;gap:20px}
.eyebrow{font:600 12px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.triage h1{margin-top:10px}
.tri{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.tri>div{border:1px solid var(--line);border-radius:14px;padding:18px;background:var(--surface-2);display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.tri .lbl{font:600 12px/1 var(--f-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.tri b{font:800 44px/1 var(--f-display);font-variant-numeric:tabular-nums}
.tri .ok{background:var(--ok-bg);border-color:transparent}.tri .ok b,.tri .ok .lbl{color:var(--ok)}
.tri .btn{margin-top:auto}
.split{height:10px;border-radius:99px;overflow:hidden;background:var(--line)}
.split i{display:block;height:100%;background:var(--ok);border-radius:99px}
.resumen{font-size:18px;line-height:1.6;margin:10px 0 0;max-width:70ch}
.grps{display:flex;flex-direction:column;margin-top:12px}
.grp{border-top:1px solid var(--line)}
.grp summary{display:flex;justify-content:space-between;gap:12px;padding:13px 0;cursor:pointer;font-weight:500;list-style:none}
.grp summary::-webkit-details-marker{display:none}
.grp summary::before{content:"›";color:var(--muted);transition:transform .15s;display:inline-block;width:12px}
.grp[open] summary::before{transform:rotate(90deg)}
.grp summary>span:first-of-type{flex:1;min-width:0}
.grp .cnt{font:600 13px/1 var(--f-mono);background:var(--surface-2);border:1px solid var(--line);border-radius:99px;padding:5px 9px;height:fit-content}
.grp ul{list-style:none;margin:0;padding:0 0 12px 24px;display:flex;flex-direction:column;gap:10px}
.grp li{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.grp li .note{width:100%}

/* Guía */
.guide-hero{padding:30px 32px;display:flex;flex-direction:column;gap:14px;background:linear-gradient(160deg,var(--accent-soft),var(--surface) 60%)}
.guide-hero h1{font-size:40px}
.lead{font-size:18px;line-height:1.6;margin:0;max-width:62ch}
.gsec{display:flex;flex-direction:column;gap:16px}
.gh{display:flex;gap:14px;align-items:flex-start}
.gnum{width:34px;height:34px;flex:none;border-radius:50%;border:1.5px solid var(--accent);color:var(--accent);display:grid;place-items:center;font:700 15px/1 var(--f-display)}
.gh .sub{margin-top:2px}
.pipe{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;position:relative}
.pstep{padding:18px;display:flex;flex-direction:column;gap:6px;position:relative}
.pstep:not(:last-child)::after{content:"→";position:absolute;right:-14px;top:50%;transform:translate(50%,-50%);color:var(--muted);font-size:18px;z-index:1}
.pstep .hora{font:600 11px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.pstep .big{font:800 38px/1 var(--f-display);font-variant-numeric:tabular-nums;margin-top:4px}
.pstep.ok{background:var(--ok-bg);border-color:transparent}.pstep.ok .big{color:var(--ok)}
.anat{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:36px;align-items:start}
.demo{position:relative;overflow:visible;pointer-events:none}
.mk{position:absolute;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:700 12px/1 var(--f-ui);box-shadow:0 0 0 3px var(--bg)}
.mk.s{position:static;box-shadow:none;flex:none}
.legend-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.legend-list li{display:flex;gap:12px}
.legend-list b{display:block}.legend-list div span{color:var(--muted)}
.routine{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.rstep{padding:18px;display:flex;flex-direction:column;gap:6px}
.rn{font:800 15px/1 var(--f-mono);color:var(--accent)}
.flowstate{padding:14px 18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.arr{color:var(--muted)}
.secs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.sc{padding:18px;display:flex;flex-direction:column;gap:6px;text-decoration:none;color:inherit}
a.sc:hover{border-color:var(--accent)}
.faq{padding:6px 22px}
.faq details{border-top:1px solid var(--line)}.faq details:first-child{border-top:0}
.faq summary{padding:15px 0;cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:12px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";color:var(--accent);font-size:20px;line-height:1}
.faq details[open] summary::after{content:"–"}
.faq p{margin:0 0 16px;color:var(--muted);max-width:72ch}
@media (max-width:980px){.pipe,.routine{grid-template-columns:repeat(2,minmax(0,1fr))}.pstep::after{display:none}.anat{grid-template-columns:minmax(0,1fr)}.secs{grid-template-columns:repeat(2,minmax(0,1fr))}}

<script type="application/json" id="datos">{"dias": {"20261102": {"fecha": "20261102", "total_boe": 132, "revisadas": 59, "resumen_del_dia": "Día tranquilo. Lo más relevante para el despacho es la Orden TED/1152/2026, que cambia cómo se calcula la retribución de las plantas de cogeneración con biomasa y entra en vigor mañana. Además, el Tesoro convoca la subasta de Obligaciones del Estado del 5 de noviembre y se publican dos declaraciones de impacto ambiental para proyectos renovables híbridos.", "fichas": [{"id": "BOE-A-2026-22888", "titulo": "Orden TED/1152/2026, de 27 de octubre, por la que se modifica la Orden TED/526/2024, de 31 de mayo, sobre la metodología de actualización de la retribución a la operación de las instalaciones tipo cuyos costes de explotación dependan esencialmente del precio del combustible", "departamento": "Ministerio para la Transición Ecológica y el Reto Demográfico", "url": "https://www.boe.es/diario_boe/txt.php?id=BOE-A-2026-22888", "relevancia": 3, "areas": ["Energía", "Regulatorio financiero"], "que_cambia": "Añade un nuevo artículo 12 bis con una fórmula propia para actualizar la retribución a la operación de las instalaciones de cogeneración con biomasa, que hasta ahora se calculaba igual que la de las plantas de biomasa que solo producen electricidad. La fórmula nueva tiene en cuenta el ahorro por aprovechar el calor. Además, las actualizaciones trimestrales ya no necesitan un informe previo de Hacienda, basta con comunicárselas.", "a_quien_afecta": "Titulares e inversores de plantas de cogeneración con biomasa en el régimen retributivo específico, en concreto las que obtengan ese derecho después de la entrada en vigor de la orden. También sirve como dato para fondos y bancos que financian o compran proyectos de biomasa.", "accion_para_ilp": "Avisar a los clientes del sector energético con proyectos de biomasa o cogeneración. Tenerlo en cuenta en las due diligence y en los modelos de ingresos de operaciones de M&A o de financiación de este tipo de plantas. Puede dar para una nota breve en el blog.", "plazos": "Entra en vigor el 3 de noviembre de 2026, el día siguiente a su publicación. La retribución se sigue actualizando cada trimestre natural.", "para_no_juristas": "Algunas plantas que producen electricidad con renovables o con cogeneración cobran del sistema eléctrico una ayuda regulada además del precio de mercado. Una parte de esa ayuda, la 'retribución a la operación', cubre los costes de funcionamiento y se revisa cada trimestre según el precio del combustible. La cogeneración produce a la vez electricidad y calor útil. Esta orden ministerial, que es una norma de rango inferior a la ley aprobada por un ministro, ajusta la fórmula para que esas plantas cobren según sus costes reales.", "titulo_corto": "Nueva fórmula de retribución para la cogeneración con biomasa", "fechas_clave": [{"fecha": "2026-11-03", "texto": "Entra en vigor la Orden TED/1152/2026"}]}, {"id": "BOE-A-2026-22997", "titulo": "Resolución de 30 de octubre de 2026, de la Dirección General del Tesoro y Política Financiera, por la que se disponen determinadas emisiones de Obligaciones del Estado en el mes de noviembre de 2026 y se convocan las correspondientes subastas", "departamento": "Ministerio de Economía, Comercio y Empresa", "url": "https://www.boe.es/diario_boe/txt.php?id=BOE-A-2026-22997", "relevancia": 2, "areas": ["Regulatorio financiero"], "que_cambia": "Convoca la subasta del 5 de noviembre de 2026, en la que se ofrecen nuevos tramos de cuatro Obligaciones del Estado ya existentes: al 3,10 % con vencimiento en 2031, al 3,40 % a diez años con vencimiento en 2036, al 3,50 % a quince años con vencimiento en 2041 y una indexada a la inflación europea al 0,70 % con vencimiento en 2033.", "a_quien_afecta": "Bancos, gestoras de fondos y aseguradoras que invierten en deuda pública, y en especial las entidades Creadores de Mercado, que son las únicas que pueden acudir a la segunda vuelta de la subasta.", "accion_para_ilp": "No exige acción. Es un dato de mercado útil para seguir los tipos de la deuda española y para comentarios de mercado.", "plazos": "Subasta el 5 de noviembre de 2026. Puesta en circulación y pago el 10 de noviembre de 2026.", "para_no_juristas": "El Estado se financia pidiendo dinero prestado a los inversores mediante títulos de deuda. Las 'Obligaciones' son los títulos a más largo plazo (más de cinco años). El Tesoro las vende en subastas con un calendario fijado a principios de año, y esta resolución concreta qué títulos salen a la venta este mes.", "titulo_corto": "Subasta de Obligaciones del Estado de noviembre", "fechas_clave": [{"fecha": "2026-11-05", "texto": "Subasta de Obligaciones del Estado"}, {"fecha": "2026-11-10", "texto": "Pago y puesta en circulación de las Obligaciones"}]}, {"id": "BOE-A-2026-22987", "titulo": "Resolución de 22 de octubre de 2026, de la Dirección General de Calidad y Evaluación Ambiental, por la que se formula declaración de impacto ambiental del «Proyecto Módulo de Generación Eólica \"Las Quinientas\", para su hibridación con el parque fotovoltaico existente \"Las Quinientas\", y para su infraestructura de evacuación, en la provincia de Cádiz»", "departamento": "Ministerio para la Transición Ecológica y el Reto Demográfico", "url": "https://www.boe.es/diario_boe/txt.php?id=BOE-A-2026-22987", "relevancia": 2, "areas": ["Energía"], "que_cambia": "El Ministerio fija las condiciones ambientales para añadir un módulo eólico a una planta fotovoltaica que ya funciona en Cádiz. El promotor es BRUC Las Quinientas, SL. El proyecto queda reducido a cinco aerogeneradores de 6,6 MW, frente a los once que se planteaban al principio, con medidas como la parada definitiva de un aerogenerador si causa demasiadas colisiones de aves.", "a_quien_afecta": "Al promotor y a quien financie o invierta en el proyecto. Como referencia, a cualquier promotor de proyectos de hibridación eólica y solar.", "accion_para_ilp": "Útil como precedente de las condiciones que el Ministerio impone a los proyectos híbridos, por ejemplo la reducción del número de aerogeneradores y el control de la avifauna, en due diligence de proyectos renovables.", "plazos": "No indica en el extracto revisado. El proyecto todavía necesita su autorización administrativa.", "para_no_juristas": "Antes de autorizar un proyecto grande, la Administración evalúa su impacto en el medio ambiente. La 'declaración de impacto ambiental' (DIA) es el informe final de esa evaluación y fija las condiciones con las que puede construirse. 'Hibridar' significa sumar otra tecnología a una planta que ya existe, aquí eólica a una solar, aprovechando la misma conexión a la red.", "titulo_corto": "DIA del módulo eólico «Las Quinientas» (Cádiz)", "fechas_clave": []}, {"id": "BOE-A-2026-22986", "titulo": "Resolución de 19 de octubre de 2026, de la Dirección General de Calidad y Evaluación Ambiental, por la que se formula declaración de impacto ambiental del proyecto «Hibridación de la planta solar fotovoltaica PFV Herrera de los Navarros, de 21 MW de potencia instalada, con el parque eólico Herrera de los Navarros existente de 35 MW y su infraestructura de evacuación, en la provincia de Zaragoza»", "departamento": "Ministerio para la Transición Ecológica y el Reto Demográfico", "url": "https://www.boe.es/diario_boe/txt.php?id=BOE-A-2026-22986", "relevancia": 2, "areas": ["Energía"], "que_cambia": "El Ministerio fija las condiciones ambientales para añadir una planta solar de 21 MW al parque eólico de 35 MW que ya funciona en Herrera de los Navarros (Zaragoza). El promotor es Sistemas Energéticos Barandón, SA. La resolución obliga a cumplir las medidas preventivas y correctoras del estudio de impacto ambiental y las condiciones adicionales que establece.", "a_quien_afecta": "Al promotor y a quien financie o invierta en el proyecto. Como referencia, a otros promotores de proyectos de hibridación.", "accion_para_ilp": "Seguimiento del sector renovable. Puede servir para un repaso de las DIA de hibridación publicadas este año en el blog del área de Energía.", "plazos": "No indica en el extracto revisado. El proyecto todavía necesita su autorización administrativa.", "para_no_juristas": "Es el mismo tipo de documento que la ficha anterior, en este caso para añadir paneles solares a un parque eólico que ya existe. Que se publique la DIA no significa que el proyecto ya esté autorizado, es un paso previo obligatorio.", "titulo_corto": "DIA de la hibridación solar de Herrera de los Navarros (Zaragoza)", "fechas_clave": []}], "filtradas_auto": [{"motivo": "Oposiciones y concursos de personal", "n": 50}, {"motivo": "Nombramientos, ceses y jubilaciones", "n": 20}, {"motivo": "Anuncios de comunidades de regantes y otros entes", "n": 3}], "descartadas": [{"id": "BOE-A-2026-22959", "titulo_corto": "Acuerdo de Sala de Gobierno del Tribunal Supremo de 28 de septiembre de 2026, sobre composición y funcionamiento de…", "departamento": "Consejo General del Poder Judicial", "url": "https://www.boe.es/diario_boe/txt.php?id=BOE-A-2026-22959", "relevancia": 1, "motivo": "Reparto interno de asuntos y ponencias en el Tribunal Supremo. No cambia derechos ni obligaciones de los clientes.", "leida_a_fondo": true}, {"id": "BOE-A-2026-22960", "titulo_corto": "Acuerdo de Sala de Gobierno del Tribunal Supremo de 28 de septiembre de 2026, sobre modificación del Acuerdo de Sala…", "departamento": "Consejo General del Poder Judicial", "url": "https://www.boe.es/diario_boe/txt.php?id=BOE-A-2026-22960", "relevancia": 1, "motivo": "Reparto interno de asuntos y ponencias en el Tribunal Supremo. No cambia derechos ni obligaciones de los clientes.", "leida_a_fondo": true}, {"id": "BOE-A-2026-22961", "titulo_corto": "Acuerdo de Sala de Gobierno del Tribunal Supremo de 28 de septiembre de 2026, sobre modificación en las normas…", "departamento": "Consejo General del Poder Judicial", "url": "https://www.boe.es/diario_boe/txt.php?id=BOE-A-2026-22961", "relevancia": 1, "motiv xt.php?id=BOE-A-2026-23015", "relevancia": 0, "motivo": "Plan de estudios de una universidad.", "leida_a_fondo": false}, {"id": "BOE-A-2026-23016", "titulo_corto": "Plan de estudios de Graduado o Graduada en Inteligencia y Analítica de Mercados.", "departamento": "Universidades", "url": "https://www.boe.es/diario_boe/txt.php?id=BOE-A-2026-23016", "relevancia": 0, "motivo": "Plan de estudios de una universidad.", "leida_a_fondo": false}], "leidas_a_fondo": 7}, "20261103": {"fecha": "20261103", "total_boe": 240, "revisadas": 67, "leidas_a_fondo": 6, "filtradas_auto": [{"motivo": "Otras secciones (V. Anuncios. - A. Contratación del Sector Público)", "n": 51}, {"motivo": "Otras secciones (IV. Administración de Justicia)", "n": 46}, {"motivo": "Oposiciones y concursos de personal", "n": 39}, {"motivo": "Anuncios de comunidades de regantes y otros entes", "n": 26}, {"motivo": "Nombramientos, ceses y jubilaciones", "n": 8}, {"motivo": "Otras secciones (V. Anuncios. - C. Anuncios particulares)", "n": 3}], "resumen_del_dia": "Lo más relevante es la Orden TED/1157/2026: Enel Green Power reduce de 1.202 a 264,9 MW su capacidad en el nudo de transición justa Mudéjar (Teruel) y quedan 937,1 MW reservados para un futuro concurso. Además, se publican tres nuevas zonas tensionadas de vivienda en el País Vasco y la autorización de una pequeña planta solar en Sevilla.", "fichas": [{"id": "BOE-A-2026-23086", "titulo_corto": "Enel reduce de 1.202 a 264,9 MW su capacidad en el nudo Mudéjar (Teruel)", "titulo": "Orden TED/1157/2026, de 19 de octubre, por la que se modifica la Orden TED/1146/2022, de 21 de noviembre, por la que se resuelve el concurso público para la concesión de capacidad de acceso de evacuación a la red de transporte de energía eléctrica de instalaciones de generación de procedencia renovable en el nudo de transición justa Mudéjar 400 KV, convocado mediante Orden TED/1182/2021, de 2 de noviembre.", "departamento": "Ministerio para la Transición Ecológica y el Reto Demográfico", "url": "https://www.boe.es/diario_boe/txt.php?id=BOE-A-2026-23086", "relevancia": 3, "areas": ["Energía", "M&A"], "que_cambia": "Modifica la adjudicación del concurso del nudo de transición justa Mudéjar 400 kV. Como la declaración de impacto ambiental fue desfavorable para una instalación y puso condiciones al resto, la capacidad de acceso de Enel Green Power España baja de 1.202 MW a 264,9 MW, la potencia instalada queda en 406,3 MW y la garantía pasa de 221,3 a 48,8 millones de euros. Los compromisos de empleo e inversión se reducen en proporción. Red Eléctrica deberá mantener reservados los 937,1 MW liberados hasta que se convoquen nuevos procedimientos para adjudicarlos.", "a_quien_afecta": "Promotores de renovables y almacenamiento interesados en el nudo Mudéjar o en otros concursos de transición justa, y fondos e inversores en proyectos renovables.", "accion_para_ilp": "Avisar a clientes promotores de que quedan 937,1 MW reservados en Mudéjar a la espera de un nuevo concurso. Es un buen precedente sobre cómo una DIA desfavorable reduce capacidad, garantías y compromisos en un concurso, útil para due diligence y contratos de compraventa de proyectos.", "plazos": "Recurso potestativo de reposición en un mes o contencioso-administrativo ante la Audiencia Nacional en dos meses desde la publicación (3 de noviembre de 2026). No fija fecha para el nuevo concurso.", "fechas_clave": [{"fecha": "2026-12-03", "texto": "Fin del plazo de recurso de reposición contra la orden del nudo Mudéjar"}], "para_no_juristas": "Para conectar una planta renovable a la red eléctrica hace falta «capacidad de acceso», y en algunas zonas el Estado la reparte por concurso. En los nudos de «transición justa», donde cerraron centrales de carbón, gana quien promete más empleo e inversión en la zona. Aquí el ganador no puede construir todo lo previsto por motivos ambientales, así que el Ministerio le reduce la capacidad y le devuelve parte de la garantía, y la capacidad sobrante queda guardada para un concurso futuro."}, {"id": "BOE-A-2026-23088", "titulo_corto": "Nuevas zonas tensionadas de vivienda: Sopela, Urduliz y Bergara", "titulo": "Resolución de 29 de octubre de 2026, de la Secretaría de Estado de Vivienda y Agenda Urbana, por la que se publica la relación de zonas de mercado residencial tensionado que han sido declaradas en virtud del procedimiento establecido en el artículo 18 de la Ley 12/2023, de 24 de mayo, por el derecho a la vivienda, en el tercer trimestre de 2026.", "departamento": "Ministerio de Vivienda y Agenda Urbana", "url": "https://www.boe.es/diario_boe/txt.php?id=BOE-A-2026-23088", "relevancia": 2, "areas": ["M&A", "Compliance"], "que_cambia": "Publica la relación trimestral de zonas de mercado residencial tensionado declaradas en el tercer trimestre de 2026: los municipios vascos de Sopela, Urduliz y Bergara. Rigen durante tres años. En ellas se considera gran tenedor a quien tenga cinco o más viviendas en el municipio, y en los nuevos alquileres de viviendas sin contrato en los últimos cinco años la renta inicial no puede superar el índice de precios de referencia.", "a_quien_afecta": "Fondos y sociedades inmobiliarias, socimis y propietarios con cinco o más viviendas en esos municipios.", "accion_para_ilp": "Revisar si algún cliente inversor inmobiliario tiene viviendas en esos municipios y tenerlo en cuenta en due diligence de carteras residenciales en el País Vasco.", "plazos": "Surte efectos desde el día siguiente a su publicación (4 de noviembre de 2026). Las zonas rigen tres años desde esa fecha.", "fechas_clave": [{"fecha": "2026-11-04", "texto": "Efectos de las nuevas zonas tensionadas (Sopela, Urduliz y Bergara)"}], "para_no_juristas": "La Ley de vivienda de 2023 permite declarar «zonas tensionadas» donde el alquiler es muy caro. Allí se limitan las rentas y los grandes propietarios tienen más obligaciones. Cada trimestre el Ministerio publica en el BOE la lista de nuevas zonas declaradas por las comunidades autónomas."}, {"id": "BOE-B-2026-35925", "titulo_corto": "Autorización de la planta solar HSF Montellano (5,6 MW) en Morón de la Frontera", "titulo": "Resolución de la Delegación Territorial En Sevilla De Economía, Hacienda, Fondos Europeos y de Universidad, Industria, Energía e Innovación, por el que se concede a favor de la mercantil San Isidro Solar 6, modificación de Autorización Administrativa Previa y de Construcción para la implantación de la instalación de generación de energía eléctrica denominada \"Hsf Montellano\" con una potencia instalada de 5,6 MW el término municipal de Morón de la Frontera (Sevilla), y Declaración en concreto de Utilidad Pública para la infraestructura eléctrica de evacuación asociada.", "departamento": "Junta de Andalucía", "url": "https://www.boe.es/diario_boe/txt.php?id=BOE-B-2026-35925", "relevancia": 2, "areas": ["Energía"], "que_cambia": "La Junta de Andalucía concede a San Isidro Solar 6, S.L. la modificación de la autorización administrativa previa y de construcción de la planta fotovoltaica HSF Montellano, de 5,6 MW, en Morón de la Frontera (Sevilla), y declara de utilidad pública su línea de evacuación.", "a_quien_afecta": "Al promotor, a los propietarios de los terrenos afectados por la línea de evacuación y a posibles compradores o financiadores del proyecto.", "accion_para_ilp": "Seguimiento del sector. Es un proyecto pequeño; solo interesa si algún cliente participa en él o en una compraventa de proyectos solares en la zona.", "plazos": "No indica en el extracto revisado.", "fechas_clave": [], "para_no_juristas": "Para construir una planta solar hacen falta varias autorizaciones. La «declaración de utilidad pública» permite al promotor usar terrenos ajenos para la línea eléctrica, pagando la indemnización correspondiente, aunque el propietario no quiera."}], "descartadas": [{"id": "BOE-A-2026-23064", "titulo_corto": "Convenio con la Organización Nacional de Ciegos Españoles, con motivo de desarrollo de actividades de la filtradas_auto": [{"motivo": "Otras secciones (V. Anuncios. - A. Contratación del Sector Público)", "n": 57}, {"motivo": "Anuncios de comunidades de regantes y otros entes", "n": 28}, {"motivo": "Oposiciones y concursos de personal", "n": 27}, {"motivo": "Nombramientos, ceses y jubilaciones", "n": 22}, {"motivo": "Otras secciones (V. Anuncios. - C. Anuncios particulares)", "n": 1}], "resumen_del_dia": "Lo más relevante es el Real Decreto-ley 32/2026, en vigor hoy: además de las ayudas a las víctimas del accidente de Urda, añade a la ley de consumidores un tope permanente a las subidas de precios en emergencias, con devolución automática de lo cobrado de más. También sale a información pública una nueva subestación de 400 kV de Red Eléctrica en Bizkaia y se fijan los servicios mínimos de seguridad privada para la huelga del 11 de noviembre.", "fichas": [{"id": "BOE-A-2026-23104", "titulo_corto": "Tope a las subidas de precios en emergencias y ayudas por el accidente de Urda", "titulo": "Real Decreto-ley 32/2026, de 3 de noviembre, de ayudas a las víctimas del accidente ferroviario de Urda (Toledo) y por el que se garantiza la accesibilidad equitativa a bienes y servicios en situaciones de emergencia.", "departamento": "Jefatura del Estado", "url": "https://www.boe.es/diario_boe/txt.php?id=BOE-A-2026-23104", "relevancia": 3, "areas": ["Compliance", "Procesal"], "que_cambia": "El Real Decreto-ley 32/2026 hace dos cosas. Primero, crea ayudas para las víctimas del accidente ferroviario de Urda (Toledo) del 28 de octubre: 72.121,46 euros por fallecido y entre 2.404 y 84.141 euros por lesiones, más un anticipo de la indemnización por responsabilidad civil en el que el Estado se subroga frente a los responsables. Segundo, y esto es lo que más importa a las empresas, añade un nuevo artículo 20 ter a la Ley General para la Defensa de los Consumidores: en situaciones de urgencia (zona afectada gravemente por una emergencia de protección civil, o accidentes y fuerza mayor que declare el Consejo de Ministros) no se puede vender por encima del precio máximo ofertado en los 30 días anteriores, salvo subida acreditable de costes. Si se cobra de más, el consumidor tiene derecho a la devolución automática del exceso, además de las sanciones. Ya se aplica a los servicios afectados por el corte de la línea Madrid-Andalucía hasta el 10 de noviembre, prorrogable; en el transporte que tenga precios libres por normativa europea (como el aéreo) necesita antes la autorización de la Comisión Europea. También protege a los trabajadores que no pudieron llegar a su puesto por el accidente: no pueden ser sancionados.", "a_quien_afecta": "A cualquier empresa que venda a consumidores bienes o servicios cuya demanda pueda dispararse en una emergencia: transporte, alojamiento, alquiler de vehículos, distribución y comercio. Ahora mismo, sobre todo a operadores de transporte y hoteles vinculados a la ruta Madrid-Andalucía. También a aseguradoras y operadores ferroviarios por la subrogación del Estado en las indemnizaciones.", "accion_para_ilp": "Avisar a clientes de consumo, transporte y hostelería de que existe un tope de precios permanente para emergencias y de que deben poder demostrar sus precios de los 30 días anteriores (conviene guardar ese histórico y revisar los sistemas de precios dinámicos). Para el equipo procesal: el Estado se subroga en las reclamaciones de responsabilidad civil de las víctimas que cobren el anticipo. El real decreto-ley debe ser convalidado por el Congreso, así que hay que vigilar si se tramita como proyecto de ley con cambios.", "plazos": "En vigor desde hoy, 4 de noviembre de 2026. La limitación de precios en los servicios afectados por el accidente se aplica hasta el 10 de noviembre de 2026, prorrogable por el Consejo de Ministros. Las solicitudes de ayuda se presentan en tres meses desde que se publique la resolución de procedimiento de la Secretaría de Estado de Transportes.", "fechas_clave": [{"fecha": "2026-11-10", "texto": "Fin (prorrogable) del tope de precios en servicios afectados por el accidente de Urda"}], "para_no_juristas": "Cuando pasa algo grave y mucha gente necesita a la vez un tren, un hotel o un coche, los precios pueden dispararse. Esta norma prohíbe esa subida: durante la emergencia no se puede cobrar más que el precio más alto del último mes, salvo que a la empresa le hayan subido los costes. Si cobra de más, tiene que devolver la diferencia. Además da ayudas económicas rápidas a las víctimas del accidente de tren."}, {"id": "BOE-B-2026-36013", "titulo_corto": "Red Eléctrica: nueva subestación de 400 kV en Arrigorriaga (Bizkaia) a información pública", "titulo": "Anuncio de la Dependencia de Industria y Energía de la Subdelegación del Gobierno en Bizkaia, por el que se somete a Información Pública la solicitud de Autorización Administrativa Previa, Autorización Administrativa de Construcción, Declaración, en concreto, de Utilidad Pública y Declaración de Impacto Ambiental de los proyectos de Línea aérea de transporte de energía eléctrica a 400 kV doble circuito entrada y salida en Subestación Arrigorriaga de la línea Güeñes-Itxaso y la Subestación Arrigorriaga 400 kV, en la provincia de Bizkaia.", "departamento": "Ministerio de Política Territorial y Memoria Democrática", "url": "https://www.boe.es/diario_boe/txt.php?id=BOE-B-2026-36013", "relevancia": 2, "areas": ["Energía"], "que_cambia": "Se abre la información pública conjunta del proyecto y del estudio de impacto ambiental de la nueva subestación Arrigorriaga 400 kV de Red Eléctrica y de la línea de 400 kV de entrada y salida desde la línea Güeñes-Itxaso (1,26 km). El presupuesto es de unos 11,1 millones de euros. La finalidad declarada es mallar la red de transporte y permitir el acceso y la conexión de nuevos agentes. Se pide además la declaración de utilidad pública, que afecta a terrenos de particulares, de la Diputación Foral de Bizkaia y de Heidelberg Materials Hispania Cementos.", "a_quien_afecta": "A promotores de renovables, almacenamiento y grandes consumidores industriales que quieran conectarse a la red en Bizkaia, y a los propietarios de los terrenos afectados.", "accion_para_ilp": "Seguimiento del sector. Interesa a clientes que busquen capacidad de conexión en el País Vasco: un nudo nuevo de 400 kV abre opciones de acceso a la red. Si algún cliente tiene terrenos o derechos mineros afectados, puede presentar alegaciones dentro del plazo.", "plazos": "30 días desde el 5 de noviembre de 2026 para examinar el proyecto y presentar alegaciones. Si se cuentan como días hábiles (regla general), termina hacia el 17 de diciembre de 2026; conviene confirmarlo.", "fechas_clave": [{"fecha": "2026-12-17", "texto": "Fin aproximado de alegaciones a la subestación Arrigorriaga 400 kV"}], "para_no_juristas": "Red Eléctrica es la empresa que gestiona las «autopistas» de la electricidad. Quiere construir un nuevo cruce (subestación) cerca de Bilbao para que nuevas plantas y fábricas puedan conectarse. Antes de autorizarlo, cualquiera puede revisar el proyecto y presentar objeciones durante un plazo."}, {"id": "BOE-A-2026-23157", "titulo_corto": "Servicios mínimos de seguridad privada en la huelga del 11 de noviembre", "titulo": "Resolución de 30 de octubre de 2026, de la Secretaría de Estado de Seguridad, por la que se determina el porcentaje del personal de seguridad privada adscrito a los servicios esenciales, durante el desarrollo de la huelga general de ámbito supraautonómica convocada para el día 11 de noviembre de 2026.", "departamento": "Ministerio del Interior", "url": "https://www.boe.es/diario_boe/txt.php?id=BOE-A-2026-23157", "relevancia": 2, "areas": ["Compliance"], "que_cambia": "La Secretaría de Estado de Seguridad fija los servicios mínimos de seguridad privada para la huelga convocada el 11 de noviembre de 2026. Deben seguir trabajando el 80 % de los vigilantes en bancos y entidades de crédito, en el transporte de fondos, en refinerías, centrales nucleares y en el suministro de agua, gas y electricidad; el 90 % en puertos, aeropuertos, ferrocarriles y telecomunicaciones; el 85 % en protección de personas y el 80 % en centrales de alarma. Siempre debe quedar como mínimo un vigilante y respetarse la dotación mínima obligatoria de cada plan de seguridad. En los turnos que empiecen antes o terminen después de ese día, los mínimos se mantienen durante todo el turno.", "a_quien_afecta": "A entidades financieras, empresas energéticas, operadores de infraestructuras y a sus empresas de seguridad privada contratadas.", "accion_para_ilp": "Informativo. Puede ser útil avisar a clientes bancarios y energéticos de que el 11 de noviembre su seguridad privada funcionará con servicios mínimos y de que deben comprobar con su proveedor que se cumple la dotación obligatoria.", "plazos": "Huelga convocada para el 11 de noviembre de 2026.", "fechas_clave": [{"fecha": "2026-11-11", "texto": "Huelga en seguridad privada con servicios mínimos del 80 % al 90 %"}], "para_no_juristas": "Cuando hay huelga en un servicio esencial, el Gobierno obliga a que una parte de los trabajadores siga trabajando. Aquí fija qué porcentaje de vigilantes debe seguir en bancos, centrales eléctricas, aeropuertos, etc., el día de la huelga."}], "descartadas": [{"id": "BOE-A-2026-23105", "titulo_corto": "Orden EFD/1158/2026, de 28 de octubre, por la que se regula la organización y funcionamiento de la inspección…", "departamento": "Ministerio de Educación, Formación Profesional y Deportes", "url": "https://www.boe.es/diario_boe/txt.php?id=BOE-A-2026-23105", "relevancia": 0, "motivo": "Organización interna de la inspección educativa.", "leida_a_fondo": false}, {"id": "BOE-A-2026-23155", "titulo_corto": "Resolución de 23 de octubre de 2026, de la Presidencia del Tribunal Constitucional, por la que se determina la…", "departamento": "Tribunal Constitucional", "url": "https://www.boe.es/diario_boe/txt.php?id=BOE-A-2026-23155", "relevancia": 0, "motivo": "Organización inter de agua concreto.", "leida_a_fondo": false}, {"id": "BOE-B-2026-36090", "titulo_corto": "Resolución de la Delegación Territorial de Economía, Hacienda y Fondos Europeos y de Industria, Energía y Minas en…", "departamento": "Comunidad Autónoma de Andalucía", "url": "https://www.boe.es/diario_boe/txt.php?id=BOE-B-2026-36090", "relevancia": 1, "motivo": "Línea eléctrica de distribución concreta. Sin interés para los clientes.", "leida_a_fondo": true}, {"id": "BOE-B-2026-36091", "titulo_corto": "Anuncio del Servicio de Ordenación Industrial, Energética y Minera de la Dirección General de Industria, Energía y…", "departamento": "Comunidad Autónoma de Extremadura", "url": "https://www.boe.es/diario_boe/txt.php?id=BOE-B-2026-36091", "relevancia": 1, "motivo": "Línea eléctrica de distribución concreta. Sin interés para los clientes.", "leida_a_fondo": true}]}, "20261105": {"fecha": "20261105", "total_boe": 205, "revisadas": 86, "leidas_a_fondo": 13, "filtradas_auto": [{"motivo": "Otras secciones (V. Anuncios. - A. Contratación del Sector Público)", "n": 42}, {"motivo": "Anuncios de comunidades de regantes y otros entes", "n": 42}, {"motivo": "Oposiciones y concursos de personal", "n": 21}, {"motivo": "Nombramientos, ceses y jubilaciones", "n": 14}], "resumen_del_dia": "Lo más relevante es la declaración de impacto ambiental desfavorable para cinco parques eólicos en Galicia que suman 291 MW, y la denegación de otro parque en Pontevedra. Además, tres resoluciones registrales útiles: hipotecas entre particulares, la división de un hotel en habitaciones vendibles y el nombramiento de liquidador en una sociedad extinguida. Hacienda mantiene los módulos para 2027, con plazo de renuncia hasta el 31 de diciembre.", "fichas": [{"id": "BOE-A-2026-23246", "titulo_corto": "Declaración ambiental desfavorable para cinco parques eólicos en Galicia (291 MW)", "titulo": "Resolución de 20 de octubre de 2026, de la Dirección General de Calidad y Evaluación Ambiental, por la que se formula declaración de impacto ambiental del proyecto «Parques eólicos \"Agromaces\", de 60,67 MW, \"Ventoburgo\", de 59,85 MW, \"Sistesas\", de 55,92 MW, \"Xestiloi\", de 58,31 MW y \"Agratina\", de 56,24 MW, así como sus infraestructuras de evacuación asociadas, en las provincias de Lugo, Pontevedra y Ourense».", "departamento": "Ministerio para la Transición Ecológica y el Reto Demográfico", "url": "https://www.boe.es/diario_boe/txt.php?id=BOE-A-2026-23246", "relevancia": 3, "areas": ["Energía", "M&A"], "que_cambia": "El Ministerio para la Transición Ecológica formula declaración de impacto ambiental desfavorable para el conjunto de cinco parques eólicos «Agromaces», «Ventoburgo», «Sistesas», «Xestiloi» y «Agratina», de 290,99 MW en total, en Lugo, Pontevedra y Ourense. Los promotores son Tipuana Wind, Seyal Wind, Cercis Wind, Caoba Wind y Betula Wind. Aunque durante la tramitación se modificó el proyecto y se redujo el número de aerogeneradores, hubo informes desfavorables de varios organismos (salud pública, que lo mantuvo tras la modificación; patrimonio natural de la Xunta; Confederación Hidrográfica Miño-Sil) y hubo más de 3.700 alegaciones. El órgano ambiental concluye que no queda acreditada la viabilidad ambiental del proyecto.", "a_quien_afecta": "A los promotores y a quien haya invertido en los proyectos o tenga contratos de compraventa, financiación o suministro ligados a ellos. Indirectamente, a otros proyectos eólicos en Galicia por el criterio que aplica el Ministerio.", "accion_para_ilp": "Revisar si algún cliente es comprador, financiador o vendedor de estos parques: una DIA desfavorable suele activar condiciones resolutorias o ajustes de precio en contratos de compraventa de proyectos. Útil como precedente en due diligence de eólica en Galicia: el Ministerio rechaza proyectos con estudios de impacto incompletos aunque se reformen durante el trámite.", "plazos": "No indica plazos en el texto revisado.", "fechas_clave": [], "para_no_juristas": "Antes de construir un parque eólico grande, el Ministerio estudia su impacto en la naturaleza, el agua, el patrimonio y la salud. Aquí dice que no: los estudios eran insuficientes y los daños no estaban bien resueltos. Sin ese visto bueno ambiental, el proyecto no puede seguir adelante tal como está."}, {"id": "BOE-A-2026-23216", "titulo_corto": "Hipotecas entre particulares: un solo préstamo inscrito no convierte al prestamista en profesional", "titulo": "Resolución de 21 de julio de 2026, de la Dirección General de Seguridad Jurídica y Fe Pública, en el recurso interpuesto contra la calificación del registrador de la propiedad de Solsona, por la que se suspende la inscripción de una escritura de préstamo hipotecario por razón de entender que el crédito garantizado con la hipoteca está sujeto a la Ley 5/2019, de 15 de marzo, reguladora de los contratos de crédito inmobiliario.", "departamento": "Ministerio de la Presidencia, Justicia y Relaciones Con las Cortes", "url": "https://www.boe.es/diario_boe/txt.php?id=BOE-A-2026-23216", "relevancia": 2, "areas": ["Regulatorio financiero"], "que_cambia": "La Dirección General de Seguridad Jurídica y Fe Pública revoca la calificación de un registrador que había suspendido la inscripción de una hipoteca sobre vivienda habitual concedida por un particular. El registrador consideraba que el prestamista era profesional y que debía aplicarse la Ley 5/2019 de crédito inmobiliario. La Dirección General recuerda su criterio: hacen falta al menos dos préstamos hipotecarios inscritos a favor del mismo acreedor para presumir habitualidad. Como en el servicio de interconexión de registros solo constaba uno, la Ley 5/2019 no se aplica.", "a_quien_afecta": "A inversores particulares y family offices que prestan con garantía hipotecaria, a plataformas de préstamos entre particulares y a sus notarios.", "accion_para_ilp": "Tenerlo en cuenta al estructurar préstamos hipotecarios de inversores no bancarios: a partir de la segunda hipoteca inscrita, el registro presumirá que el prestamista está sujeto a la Ley 5/2019 y pedirá cumplir sus requisitos (información precontractual, acta notarial, etc.).", "plazos": "Recurrible ante el Juzgado de lo Civil en dos meses desde la notificación a los interesados.", "fechas_clave": [], "para_no_juristas": "Cuando alguien presta dinero con hipoteca sobre una vivienda, hay una ley que protege mucho al que pide el préstamo, pero solo se aplica si el que presta lo hace de forma profesional. El criterio es sencillo: si el prestamista tiene dos o más hipotecas inscritas a su favor, se le trata como profesional. Con una sola, no."}, {"id": "BOE-A-2026-23228", "titulo_corto": "No se inscribe el liquidador nombrado en una junta a la que no asistió el socio único", "titulo": "Resolución de 22 de julio de 2026, de la Dirección General de Seguridad Jurídica y Fe Pública, en el recurso interpuesto contra la nota de calificación extendida por el registrador mercantil III de Madrid, por la que se rechaza la solicitud de inscripción de liquidador de una sociedad.", "departamento": "Ministerio de la Presidencia, Justicia y Relaciones Con las Cortes", "url": "https://www.boe.es/diario_boe/txt.php?id=BOE-A-2026-23228", "relevancia": 2, "areas": ["Societario", "Concursal y reestructuración"], "que_cambia": "Un acreedor hipotecario consiguió que el Registro Mercantil convocara la junta de una sociedad ya extinguida tras su concurso, para nombrar un liquidador y regularizar unas fincas que quedaron fuera del concurso. En la junta compareció una sociedad panameña que decía ser socia mayoritaria indirecta y nombró liquidador. La Dirección General confirma la negativa del Registrador Mercantil III de Madrid a inscribirlo: el socio único era otra sociedad que no asistió, y quien acudió no acreditó ser socio ni representarlo. El presidente de la junta no puede reconocer la legitimación de un asistente cuando la propia documentación o el Registro dicen lo contrario.", "a_quien_afecta": "A acreedores que necesitan reabrir una sociedad extinguida para ejecutar garantías o liquidar activos sobrantes, y a quienes asesoran juntas convocadas por el registrador.", "accion_para_ilp": "Para operaciones de reestructuración o recuperación de activos: antes de convocar la junta de una sociedad extinguida, comprobar bien quién es el socio actual (también los socios indirectos) y llevar su representación acreditada. Si no, el nombramiento de liquidador no llegará al Registro.", "plazos": "Recurrible ante el Juzgado de lo Mercantil en dos meses desde la notificación a los interesados.", "fechas_clave": [], "para_no_juristas": "Una empresa desaparecida tras quebrar todavía tenía algunos inmuebles. Un acreedor quiso reunir a los dueños para nombrar a alguien que los gestionara, pero a la reunión fue una empresa que no era la dueña. El Registro dice que ese nombramiento no vale: solo los verdaderos socios pueden decidir."}, {"id": "BOE-A-2026-23223", "titulo_corto": "Un hotel no puede dividirse en 57 habitaciones vendibles sin autorización urbanística y turística", "titulo": "Resolución de 22 de julio de 2026, de la Dirección General de Seguridad Jurídica y Fe Pública, en el recurso interpuesto contra la nota de calificación de la registradora de la propiedad de Madrid n.º 28, por la que suspende la inscripción de una escritura de constitución de propiedad horizontal de las habitaciones de un edificio destinado a hotel en fincas descritas como locales de uso hotelero.", "departamento": "Ministerio de la Presidencia, Justicia y Relaciones Con las Cortes", "url": "https://www.boe.es/diario_boe/txt.php?id=BOE-A-2026-23223", "relevancia": 2, "areas": ["M&A"], "que_cambia": "La Dirección General confirma la suspensión de la inscripción de una escritura que dividía en propiedad horizontal un edificio destinado a hotel en Madrid en 57 fincas independientes, una por habitación («locales de uso hotelero»). Para inscribirla hace falta un acto administrativo expreso que confirme, según la normativa urbanística y turística, que esa división en 57 habitaciones con tráfico jurídico independiente es compatible con la explotación unitaria del edificio como hotel.", "a_quien_afecta": "A promotores e inversores inmobiliarios que estructuran hoteles para vender habitaciones a inversores (condo-hotel), y a compradores de activos hoteleros en Madrid.", "accion_para_ilp": "En operaciones hoteleras en Madrid con venta por habitaciones, prever desde el principio la licencia o conformidad urbanística y turística de la división horizontal y un régimen de explotación unitaria en el título constitutivo. Conviene incluirlo como condición en los contratos con inversores.", "plazos": "Recurrible ante el Juzgado de lo Civil en dos meses desde la notificación a los interesados.", "fechas_clave": [], "para_no_juristas": "El dueño de un hotel quería convertir cada habitación en una propiedad separada para poder venderlas una a una. El Registro dice que antes el Ayuntamiento tiene que confirmar que eso es compatible con que el edificio siga funcionando como un único hotel."}, {"id": "BOE-A-2026-23249", "titulo_corto": "Se deniega el parque eólico «As Fenteiras» (62,8 MW) tras su DIA desfavorable", "titulo": "Resolución de 19 de junio de 2026, de la Dirección General de Política Energética y Minas, por la que se desestima la solicitud de Helioceratops Invest, SL, de autorización administrativa previa del parque eólico «As Fenteiras», de 62,79 MW de potencia instalada, y de su infraestructura de evacuación, en A Cañiza y Covelo (Pontevedra).", "departamento": "Ministerio para la Transición Ecológica y el Reto Demográfico", "url": "https://www.boe.es/diario_boe/txt.php?id=BOE-A-2026-23249", "relevancia": 2, "areas": ["Energía"], "que_cambia": "La Dirección General de Política Energética y Minas desestima la autorización administrativa previa del parque eólico «As Fenteiras», de 62,79 MW, de Helioceratops Invest, SL, en A Cañiza y Covelo (Pontevedra), y archiva el expediente. El proyecto tuvo declaración de impacto ambiental desfavorable en noviembre de 2025 y Red Eléctrica comunicó la caducidad de sus permisos de acceso y conexión en la subestación Fontefría 220 kV. La resolución recuerda que, según el Real Decreto-ley 23/2020, las garantías no se ejecutan si la DIA desfavorable no es imputable al promotor.", "a_quien_afecta": "Al promotor y a quien tenga intereses en el proyecto; también a otros promotores que compitan por capacidad en esa zona de la red.", "accion_para_ilp": "Seguimiento del sector. Si algún cliente tiene garantías depositadas en un proyecto con DIA desfavorable, la resolución confirma la vía para pedir que no se ejecuten.", "plazos": "Recurso de alzada ante la Secretaría de Estado de Energía en un mes desde el día siguiente a la publicación (5 de noviembre de 2026).", "fechas_clave": [{"fecha": "2026-12-05", "texto": "Fin del plazo de recurso de alzada contra la denegación de «As Fenteiras»"}], "para_no_juristas": "Este parque eólico ya había suspendido el examen ambiental y, además, había perdido su sitio para conectarse a la red. Ahora el Ministerio lo rechaza formalmente y cierra el expediente."}, {"id": "BOE-A-2026-23174", "titulo_corto": "Módulos de IRPF e IVA para 2027: se mantienen y hay plazo para renunciar hasta el 31 de diciembre", "titulo": "Orden HAC/1161/2026, de 4 de noviembre, por la que se desarrollan para el año 2027 el método de estimación objetiva del Impuesto sobre la Renta de las Personas Físicas y el régimen especial simplificado del Impuesto sobre el Valor Añadido.", "departamento": "Ministerio de Hacienda", "url": "https://www.boe.es/diario_boe/txt.php?id=BOE-A-2026-23174", "relevancia": 2, "areas": ["Fiscal"], "que_cambia": "La Orden HAC/1161/2026 fija para 2027 el método de estimación objetiva (módulos) del IRPF y el régimen simplificado del IVA. Mantiene los módulos y las instrucciones de 2026 y la reducción general del 5 % del rendimiento neto. Para actividades agrícolas y ganaderas, en 2026 permite restar el 35 % del gasóleo agrícola y el 15 % de los fertilizantes y eleva su reducción general al 10 %. Quien quiera renunciar a módulos para 2027, o revocar una renuncia, puede hacerlo hasta el 31 de diciembre de 2026.", "a_quien_afecta": "A autónomos y pequeñas empresas que tributan por módulos (hostelería, comercio minorista, transporte, agricultura). Poco probable que afecte directamente a los clientes habituales del despacho.", "accion_para_ilp": "Informativo. Solo si algún cliente persona física o pequeño negocio tributa por módulos: valorar antes del 31 de diciembre si le conviene renunciar para 2027.", "plazos": "Entra en vigor el 6 de noviembre de 2026, con efectos para 2027. Renuncias y revocaciones hasta el 31 de diciembre de 2026.", "fechas_clave": [{"fecha": "2026-12-31", "texto": "Último día para renunciar a módulos (IRPF/IVA) para 2027"}], "para_no_juristas": "Algunos autónomos no pagan impuestos según lo que ganan realmente, sino según unos «módulos» fijos (metros del local, número de empleados...). Hacienda dice que en 2027 siguen igual. Quien prefiera pagar por lo que gana de verdad tiene hasta fin de año para cambiarse."}], "descartadas": [{"id": "BOE-A-2026-23173", "titulo_corto": "Entrada en vigor del Acuerdo entre la Unión Europea y la Comunidad Europea de la Energía Atómica, por una parte, y…", "departamento": "Ministerio de Asuntos Exteriores, Unión Europea y Cooperación", "url": "https://www.boe.es/diario_boe/txt.php?id=BOE-A-2026-23173", "relevancia": 0, "motivo": "Acuerdo internacional sobre la sede de un organismo europeo.", "leida_a_fondo": false}, {"id": "BOE-A-2026-23175", "titulo_corto": "Orden CLT/1162/2026, de 30 de octubre, por la que se establece la obligatoriedad de comunicaciones y…", "departamento": "Ministerio de Cultura", "url": "https://www.boe.es/diario_boe/txt.php?id=BOE-A-2026-23175", "relevancia": 0, "motivo": "Trámite de subvenciones culturales.", "leida_a_fondo": false}, {"id": "BOE-A-2026-23176", "titulo_corto": "Real Decreto 957/2026, de 4 de noviembre, de desarrollo del régimen jurídico de la prestación económica por…", "departamento": "Ministerio de Inclusión, Seguridad Social y Migraciones", "url": "https://www.boe.es/diario_boe/txt.php?id=BOE-A-2026-23176", "relevancia": 1, "motivo": "Prestación de Seguridad Social para familias. Fuera de las áreas del despacho.", "leida_a_fondo": true}, {"id": "BOE-A-2026-23177", "titulo_corto": "Real Decreto 958/2026, de 4 de noviembre, por el que se adoptan medidas de impulso de la tecnología DAB+ en el…", "departamento": "Ministerio para la Transformación Digital y de la Función Pública", "url": "https://www.boe.es/diario_boe/txt.php?id=BOE-A-2026-23177", "relevancia": 1, "motivo": "Norma técnica de radiodifusión. Solo afecta a emisoras de radio.", "leida_a_fondo": true}, {"id": "BOE-A-2026-23178", "titulo_corto": "Resolución de 29 de octubre de 2026, de la Presidencia del Tribunal de Cuentas, por la que se publica el Acuerdo…", "departamento": "Tribunal de Cuentas", "url": "https://www.boe.es/diario_boe/txt.php?id=BOE-A-2026-23178", "relevancia": 0, "motivo": "Control de la contabilidad electoral de los partidos.", "leida_a_fondo": false}, {"id": "BOE-A-2026-23179", "titulo_corto": "Decreto-ley 2/2026, de 7 de agosto, por el cual se establecen medidas en materia de protección de la salud pública.", "departamento": "Comunidad Autónoma de las Illes Balears", "url": "https://www.boe.es/diario_boe/txt.php?id=BOE-A-2026-23179", "relevancia": 0, "motivo": "Norma autonómica de salud o educación, fuera del ámbito del despacho.", "leida_a_fondo": false}, {"id": "BOE-A-2026-23180", "titulo_corto": "Decreto-ley 3/2026, de 7 de agosto, por el cual se establecen medidas urgentes en materia de educación.", "departamento": "Comunidad Autónoma de las Illes Balears", "url": "https://www.boe.es/diario_boe/txt.php?id=BOE-A-2026-23180", "relevancia": 0, "motivo": "Norma autonómica de salud o educación, fuera del ámbito del despacho.", "leida_a_fondo" Los ayuntamientos deben enviar al Ministerio para la Transición Ecológica y a su comunidad autónoma la ordenanza de la ZBE (en un mes desde su entrada en vigor) y documentación que acredite que ya funcionan las restricciones de acceso, circulación y aparcamiento, el sistema de control de accesos, la conexión con el Punto de Acceso Nacional de la DGT y el régimen sancionador, «que excluirá cualquier sistema transitorio de avisos». Mientras no se reciba esa documentación, la ZBE no se considerará correctamente implantada.", "a_quien_afecta": "A los ayuntamientos obligados a tener ZBE y, de forma indirecta, a empresas con flotas de reparto, logística, transporte o vehículos comerciales que circulan por ciudades: el Gobierno empuja a que las restricciones se apliquen con multas reales y sin periodos de solo avisos.", "accion_para_ilp": "Avisar a clientes con flotas urbanas de que es previsible que más ciudades pasen de avisar a multar en sus ZBE. Conviene revisar qué vehículos tienen etiqueta ambiental insuficiente en las ciudades donde operan.", "plazos": "El real decreto no fija fecha de entrada en vigor en el texto revisado; por la regla general del Código Civil, entraría en vigor a los 20 días de su publicación (hacia el 26 de noviembre de 2026). Conviene confirmarlo.", "fechas_clave": [{"fecha": "2026-11-26", "texto": "Entrada en vigor prevista del nuevo requisito de acreditación de las ZBE"}], "para_no_juristas": "Muchas ciudades tienen «zonas de bajas emisiones» donde los coches más contaminantes no pueden entrar, pero algunas solo ponen avisos y no multan. Ahora el Gobierno dice que una zona así solo cuenta si de verdad funciona: cámaras, conexión con Tráfico y multas."}, {"id": "BOE-A-2026-23267", "titulo_corto": "Nuevo reglamento de biocidas: registro, fabricación, venta, uso y sanciones desde julio de 2027", "titulo": "Real Decreto 952/2026, de 4 de noviembre, por el que se regula el registro y las condiciones de autorización, fabricación, comercialización y uso de biocidas.", "departamento": "Ministerio de la Presidencia, Justicia y Relaciones Con las Cortes", "url": "https://www.boe.es/diario_boe/txt.php?id=BOE-A-2026-23267", "relevancia": 2, "areas": ["Compliance"], "que_cambia": "El Real Decreto 952/2026 sustituye la normativa nacional de biocidas (desinfectantes, insecticidas, conservantes y similares) que completa el Reglamento europeo 528/2012. Actualiza el Registro Oficial de Biocidas, el registro de establecimientos y servicios biocidas (ROESB), las condiciones de fabricación, almacenamiento, venta y uso, la formación de los aplicadores y el régimen de infracciones y sanciones. Introduce un sistema de trazabilidad de las transacciones de biocidas que sustituye al Libro Oficial de Movimientos, con seis meses de adaptación. Deroga la reglamentación de plaguicidas de 1983, salvo algunos artículos, y el decreto de desinsectación de 1965.", "a_quien_afecta": "A fabricantes, importadores, distribuidores y empresas de servicios de control de plagas y desinfección, y a empresas que usan biocidas en su actividad (alimentación, limpieza industrial, hostelería).", "accion_para_ilp": "Para clientes del sector químico, limpieza o alimentación: revisar con tiempo sus registros y procedimientos y preparar el nuevo sistema de trazabilidad antes de julio de 2027. Útil también en due diligence de empresas de control de plagas.", "plazos": "Entra en vigor el 1 de julio de 2027 (una parte de la derogación produce efectos desde el 7 de noviembre de 2026). El sistema de trazabilidad se aplica seis meses después de la entrada en vigor.", "fechas_clave": [{"fecha": "2027-07-01", "texto": "Entra en vigor el nuevo reglamento nacional de biocidas"}], "para_no_juristas": "Los biocidas son productos que matan bichos, bacterias u hongos: lejías profesionales, insecticidas, desinfectantes. Esta norma actualiza cómo se registran, se venden y se usan en España, y cómo se sanciona a quien no cumpla. Las empresas tienen hasta julio de 2027 para adaptarse."}, {"id": "BOE-A-2026-23332", "titulo_corto": "Ayudas de transición justa: más margen para ejecutar la inversión y menos reintegros", "titulo": "Orden TED/1171/2026, de 28 de octubre, por la que se modifican la Orden TED/1240/2022, de 14 de diciembre, por la que se aprueban las bases reguladoras para la concesión de ayudas dirigidas a proyectos empresariales generadores de empleo, que promuevan el desarrollo alternativo de las zonas de transición justa, para el periodo 2022-2027, y la Orden TED/1239/2022, de 14 de diciembre, por la que se aprueban las bases reguladoras para la concesión de ayudas dirigidas a pequeños proyectos de inversión que generen o mantengan el empleo, promoviendo el desarrollo alternativo de las zonas de transición justa, para el periodo 2022-2027.", "departamento": "Ministerio para la Transición Ecológica y el Reto Demográfico", "url": "https://www.boe.es/diario_boe/txt.php?id=BOE-A-2026-23332", "relevancia": 2, "areas": ["Energía"], "que_cambia": "La Orden TED/1171/2026 modifica las bases de las ayudas del Instituto para la Transición Justa a proyectos empresariales que generen empleo en zonas afectadas por el cierre de minas y centrales de carbón o nucleares. En los proyectos grandes, el requisito de haber ejecutado y pagado el 15 % de la inversión en los nueve primeros meses pasa a ser un 8 % acreditado al pedir la prórroga. En los pequeños proyectos, la inversión mínima baja de 30.000 a 6.000 euros y se amplían a más municipios los proyectos de bares, comercios y servicios. Si se incumple en parte la inversión, la reducción se aplicará solo a la parte de la ayuda ligada a la inversión, no a toda la ayuda. Se adapta además al nuevo límite de minimis de 300.000 euros.", "a_quien_afecta": "A empresas e inversores con proyectos industriales o de servicios en zonas de transición justa afectadas por el cierre de minas, centrales de carbón o nucleares.", "accion_para_ilp": "Avisar a clientes industriales o promotores con proyectos en estas zonas: las próximas convocatorias serán más flexibles. Los cambios solo se aplican a las convocatorias que se aprueben después de esta orden.", "plazos": "Entra en vigor el 7 de noviembre de 2026. Se aplica a las convocatorias posteriores.", "fechas_clave": [], "para_no_juristas": "El Estado da ayudas a empresas que crean empleo en las zonas donde han cerrado minas o centrales. Antes muchas perdían la ayuda porque los permisos tardaban y no podían invertir a tiempo. Ahora las reglas son más flexibles y, si se incumple un poco, se devuelve menos."}, {"id": "BOE-B-2026-36324", "titulo_corto": "Baterías de 42 MW junto a la planta solar Prisca (Jerez) con exención de evaluación ambiental", "titulo": "Anuncio del Área de Industria y Energía de la Delegación del Gobierno en Andalucía por el que se somete a información pública, la solicitud de autorización administrativa previa y autorización administrativa de construcción para el módulo de almacenamiento por baterías BESS Prisca, de 42 MW de potencia instalada, para su hibridación con el parque solar fotovoltaico existente Prisca, de 49,45 MW, en la provincia de Cádiz. Expdte. PFot-ALM-235.", "departamento": "Ministerio para la Transición Ecológica y el Reto Demográfico", "url": "https://www.boe.es/diario_boe/txt.php?id=BOE-B-2026-36324", "relevancia": 2, "areas": ["Energía"], "que_cambia": "Sale a información pública el módulo de almacenamiento con baterías «BESS Prisca», de 42 MW y 161 MWh, que Prisca Solar, S.L. quiere añadir a su planta fotovoltaica existente de 49,45 MW en Jerez de la Frontera (Cádiz). Se tramita por el procedimiento simplificado del Real Decreto 997/2025 y queda exento de evaluación de impacto ambiental simplificada porque las baterías se sitúan dentro de la zona ya evaluada en el proyecto original. Hoy se publican otros dos módulos de baterías por el mismo procedimiento: Peñarrubia (40,5 MW, Yecla) y OPDE Trévago 2 (30 MW, Soria).", "a_quien_afecta": "A promotores y fondos con plantas solares en operación que quieran añadir almacenamiento, y a compradores de esos activos.", "accion_para_ilp": "Seguimiento del sector. Muestra que la hibridación con baterías dentro de la poligonal ya evaluada se está tramitando sin evaluación ambiental: útil para clientes que valoran añadir almacenamiento a plantas existentes.", "plazos": "Quince días desde el 7 de noviembre de 2026 para presentar alegaciones (si son hábiles, hasta el 27 de noviembre aproximadamente).", "fechas_clave": [{"fecha": "2026-11-27", "texto": "Fin aproximado de alegaciones a las baterías de Prisca (Jerez)"}], "para_no_juristas": "Las baterías permiten guardar la electricidad solar del día para usarla por la noche. Añadirlas a una planta solar que ya existe ahora es más rápido: si se ponen dentro del terreno ya estudiado, no hace falta repetir el examen ambiental."}, {"id": "BOE-B-2026-36325", "titulo_corto": "Arranca la subasta de combustible para las centrales de las islas, Ceuta y Melilla", "titulo": "Anuncio de la Subdirección General de Energía Eléctrica por el que se da publicidad al Acuerdo de la Dirección General de Política Energética y Minas por el que se inicia el procedimiento de subasta para el suministro de combustibles fósiles y la determinación de su precio, aplicable a los grupos de producción de energía eléctrica con régimen retributivo adicional ubicados en los sistemas eléctricos de los territorios no peninsulares.", "departamento": "Ministerio para la Transición Ecológica y el Reto Demográfico", "url": "https://www.boe.es/diario_boe/txt.php?id=BOE-B-2026-36325", "relevancia": 2, "areas": ["Energía"], "que_cambia": "La Dirección General de Política Energética y Minas inicia el procedimiento de subasta para el suministro de combustibles fósiles y la fijación de su precio para las centrales eléctricas con retribución adicional de los territorios no peninsulares (Baleares, Canarias, Ceuta y Melilla), conforme a la Orden TED/1315/2022. La documentación está en la web del Ministerio. Las alegaciones se consideran públicas salvo las partes marcadas y justificadas como confidenciales.", "a_quien_afecta": "A los titulares de centrales en los territorios no peninsulares y a los proveedores de combustibles que puedan pujar.", "accion_para_ilp": "Seguimiento del sector. Solo interesa si algún cliente es generador en las islas o proveedor de combustibles: revisar la documentación en la web del Ministerio.", "plazos": "El anuncio no indica plazos; están en la documentación publicada en la web del Ministerio.", "fechas_clave": [], "para_no_juristas": "En las islas la electricidad se sigue produciendo en buena parte con gasóleo o gas. El Estado organiza una subasta para elegir quién suministra ese combustible y a qué precio, porque luego ese coste lo pagamos todos en la factura."}], "descartadas": [{"id": "BOE-A-2026-23264", "titulo_corto": "Acuerdo entre el Principado de Andorra y el Reino de España en materia de acceso a la educación secundaria…", "departamento": "Ministerio de Asuntos Exteriores, Unión Europea y Cooperación", "url": "https://www.boe.es/diario_boe/txt.php?id=BOE-A-2026-23264", "relevancia": 0, "motivo": "Acuerdo internacional sobre educación.", "leida_a_fondo": false}, {"id": "BOE-A-2026-23265", "titulo_corto": "Real Decreto 950/2026, de 4 de noviembre, por el que se establecen criterios para el fomento de una alimentación…", "departamento": "Ministerio de la Presidencia, Justicia y Relaciones Con las Cortes", "url": "https://www.boe.es/diario_boe/txt.php?id=BOE-A-2026-23265", "relevancia": 0, "motivo": "Norma de alimentación en comedores públicos y residencias. Fuera del ámbito del despacho.", "leida_a_fondo": false}, {"id": "BOE-A-2026-23266", "titulo_corto": "Real Decreto 951/2026, de 4 de noviembre, por el que se modifica el Real Decreto 1146/2006, de 6 de octubre, por…", "departamento": "Ministerio de la Presidencia, Justicia y Relaciones Con las Cortes", "url": "https://www.boe.es/diario_boe/txt.php?id=BOE-A-2026-23266", "relev
